apiVersion: 1

datasources:
  - name: PostgreSQL_Fraud
    uid: postgres_fraud
    type: postgres
    access: proxy
    url: postgres-fraud:5432
    database: $__env{POSTGRES_DB}
    user: $__env{POSTGRES_USER}
    secureJsonData:
      password: $__env{POSTGRES_PASSWORD}
    jsonData:
      sslmode: disable
      timescaleDB: false
    isDefault: true
    editable: true